[package]
name = "tantivy-bench"
version = "0.1.0"
authors = ["Jason Wolfe"]
edition = "2018"

[dependencies]
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
tantivy = { git = "https://github.com/lnx-search/tantivy.git", rev = "ca62d29e" }
env_logger = "0.5"
log = "0.4"
futures = "*"

[profile.release]
lto = true
opt-level = 3
overflow-checks = false
# debug-assertions = false
